<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Hitchly</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; worker-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data: blob:; base-uri 'none'; form-action 'none'">
<link rel="icon" href="ui/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="ui/app.css">
</head>
<body>
<header class="top">
  <button class="ghost" id="menu" aria-expanded="false" aria-controls="nav" aria-label="Tools menu">☰ Tools</button>
  <a class="brand" href="#/">Hitchly</a>
  <span class="spacer"></span>
  <button class="ghost" id="auth"></button>
</header>
<div class="shell">
  <nav id="nav" aria-label="Tools">
    <input id="toolSearch" type="search" placeholder="Find a tool…" aria-label="Find a tool" autocomplete="off">
    <div id="navList"></div>
  </nav>
  <main id="main" tabindex="-1"></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p class="noscript">Hitchly's tools need JavaScript.</p></noscript>
<script type="module" src="ui/app.js"></script>
</body>
</html>
