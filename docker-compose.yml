# Hitchly + Prometheus. Usage:
#   export HITCHLY_TOKEN=$(python3 -c "import secrets;print(secrets.token_urlsafe(32))")
#   docker compose up -d
services:
  hitchly:
    build: .
    environment:
      HITCHLY_TOKEN: ${HITCHLY_TOKEN:?set HITCHLY_TOKEN}
      HITCHLY_BASE_URL: ${HITCHLY_BASE_URL:-http://localhost:8080}
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["hitchly-data:/data"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    profiles: ["monitoring"]       # docker compose --profile monitoring up -d
    volumes: ["./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    environment:
      HITCHLY_TOKEN: ${HITCHLY_TOKEN:?set HITCHLY_TOKEN}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "$$HITCHLY_TOKEN" > /tmp/token
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml
    ports: ["127.0.0.1:9090:9090"]

volumes:
  hitchly-data:
