name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - name: Package installs and exposes both commands
        run: |
          pip install .
          hitch --help >/dev/null
          python -c "import hitchly, hitchly_client, hitch"

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test "tests/js/*.test.mjs"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright axe-core && npx playwright install --with-deps chromium
      - name: Browser tests against a real server
        run: |
          python tests/e2e/site.py 8087 &
          HITCHLY_PROBE_ALLOW_PRIVATE=1 HITCHLY_TOKEN=ci-token HITCHLY_PORT=8080 HITCHLY_DB=/tmp/e2e.db python -m hitchly serve &
          sleep 2
          export BASE_URL=http://127.0.0.1:8080 HITCHLY_TOKEN=ci-token
          node tests/e2e/tools.cjs
          node tests/e2e/links.cjs
          SITE_URL=http://127.0.0.1:8087 node tests/e2e/server-tools.cjs
          node tests/e2e/admin.cjs
          node tests/e2e/batch1.cjs
          node tests/e2e/a11y.cjs

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t hitchly .
