# Publishes the client-side toolbox (everything except the link/admin tools, which need a server) as a free static site.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions". See docs/HOSTING.md.
name: Pages
on:
  push:
    branches: [main]
    paths: ["hitchly/ui/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the static site (index at the root, assets under ui/)
        run: |
          mkdir _site
          cp -r hitchly/ui _site/ui
          mv _site/ui/index.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
