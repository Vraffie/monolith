[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linkly"
version = "1.0.0"
description = "Small self-hosted URL shortener with click analytics (stdlib only)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
linkly = "shortener.__main__:main_cli"

[tool.setuptools]
packages = ["shortener"]

[tool.setuptools.package-data]
shortener = ["ui.html"]
