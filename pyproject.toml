[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hitchly"
version = "1.1.0"
description = "Self-hosted URL shortener with click analytics, plus a Python SDK and CLI (stdlib only)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
hitchly = "hitchly.__main__:main_cli"
hitch = "hitchctl.cli:main_cli"

[tool.setuptools]
packages = ["hitchly", "hitchly_client", "hitchctl"]

[tool.setuptools.package-data]
hitchly = ["ui.html"]
