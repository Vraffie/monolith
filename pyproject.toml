[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "linkly"
version = "1.1.0"
description = "Self-hosted URL shortener with click analytics, plus a Python SDK and CLI (stdlib only)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
linkly = "shortener.__main__:main_cli"
linklyctl = "linklyctl.cli:main_cli"

[tool.setuptools]
packages = ["shortener", "linkly_client", "linklyctl"]

[tool.setuptools.package-data]
shortener = ["ui.html"]
